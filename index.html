<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil dos Animais</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      padding: 20px;
    }
    .lista-animais {
      width: 200px;
    }
    .lista-animais button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: left;
    }
    .lista-animais button:hover {
      background-color: #e0e0e0;
    }
    .cartao-detalhes {
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }
    .cartao-detalhes img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Lista de botões com os nomes -->
  <div class="lista-animais">
    <h3>Animais</h3>
    <button onclick="mostrarAnimal('rex')">Rex (Cão)</button>
    <button onclick="mostrarAnimal('mimi')">Mimi (Gato)</button>
    <button onclick="mostrarAnimal('thor')">Thor (Cão)</button>
  </div>

  <!-- Área onde os detalhes aparecem -->
  <div class="cartao-detalhes" id="detalhes">
    <p>Clique em um animal para ver as informações.</p>
  </div>

  <script>
    // Banco de dados simplificado dos animais
    const animais = {
      rex: {
        nome: "Rex",
        raca: "Pastor Alemão",
        idade: "3 anos",
        local: "São Paulo - SP",
        foto: "https://images.unsplash.com/photo-1589941013453-ec89f33b5e95?w=400"
      },
      mimi: {
        nome: "Mimi",
        raca: "Siamês",
        idade: "2 anos",
        local: "Rio de Janeiro - RJ",
        foto: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400"
      },
      thor: {
        nome: "Thor",
        raca: "Golden Retriever",
        idade: "5 anos",
        local: "Curitiba - PR",
        foto: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=400"
      },
      loki: {
        nome: "Loki",
        raca: "Maine Coon",
        idade: "3 anos",
        local: "Londrina - PR",
        foto: "https://media.gazetadopovo.com.br/vozes/2016/08/gatos-robert-sijka-9-c637f9e2.jpg?_gl=1*1tz9lc2*_gcl_au*MTUzMjI2NjU2Mi4xNzg3MjIzMzU5*_ga*OTcxNjY0MDY5LjE3ODcyMjMzNTk.*_ga_B7X3QY6Y1N*czE3ODcyMjMzNTkkbzEkZzAkdDE3ODcyMjMzNjIkajU3JGwwJGgw"
      },
      ruby: {
        nome: "Ruby",
        raca: "Shih Tzu",
        idade: "6 anos",
        local: "Salvador - BA",
        foto: "https://paw-champ.com/dog-wiki/breed/shih-tzu?lang=pt"
      },
      juninho: {
        nome: "Juninho",
        raca: "Sírio",
        idade: "1 anos",
        local: "Santos - SP",
        foto: "https://gaioladeourobauru.com/produto/hamster-sirio/"
      },
      hantaro: {
        nome: "hantaro",
        raca: "Chinês",
        idade: "2 anos",
        local: "Belo Horizonte - MG",
        foto: "https://blog.cobasi.com.br/hamster-chines/"
      },
    };

    // Função que atualiza o HTML com os dados do animal selecionado
    function mostrarAnimal(idAnimal) {
      const animal = animais[idAnimal];
      const container = document.getElementById("detalhes");

      container.innerHTML = `
        <img src="${animal.foto}" alt="${animal.nome}">
        <h2>${animal.nome}</h2>
        <p><strong>Raça:</strong> ${animal.raca}</p>
        <p><strong>Idade:</strong> ${animal.idade}</p>
        <p><strong>Local:</strong> ${animal.local}</p>
      `;
    }
  </script>

</body>
</html>
